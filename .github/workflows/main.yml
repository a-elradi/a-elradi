# Regenerates the contribution snake (dark + light, emerald palette) every night
# and publishes it to the `output` branch. Trigger once manually after merging:
# Actions → "Generate Snake" → Run workflow.
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: a-elradi
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#064e3b&color_dots=#ebedf0,#a7f3d0,#6ee7b7,#34d399,#10b981
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#34d399&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
